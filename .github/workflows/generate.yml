name: Generate Wallpaper

on:
  schedule:
    - cron: "17 21 * * *"  # 18:17 ART; GitHub often runs crons hours late, so this renders tomorrow
    - cron: "17 5 * * *"   # 02:17 ART backup in case the evening run is skipped
  workflow_dispatch:        # permite ejecutar manualmente desde GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libcairo2 fonts-liberation

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate wallpaper
        id: gen
        env:
          NEXT_MORNING: "1"
        run: python generate_wallpaper.py

      - name: Commit and push wallpaper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpaper.png
          git diff --cached --quiet || git commit -m "wallpaper: ${{ steps.gen.outputs.date }}"
          git pull --rebase origin main
          git push
